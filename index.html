<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Painel">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png">
<style>
/* Feito para Safari do iOS 9 (iPad mini 1, 1024x768): sem CSS grid, sem variáveis CSS. */
* { box-sizing: border-box; -webkit-box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0d1117; color: #e6edf3; overflow: hidden;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  -webkit-user-select: none; -webkit-tap-highlight-color: rgba(0,0,0,0); }
.row { display: -webkit-flex; display: flex; }
.col { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
.grow { -webkit-flex: 1; flex: 1; min-width: 0; min-height: 0; }
.center { -webkit-align-items: center; align-items: center; }
.between { -webkit-justify-content: space-between; justify-content: space-between; }
.muted { color: #8b949e; }
/* Cards semitransparentes: o céu do fundo (#skyBg) aparece por trás. */
.card { background: rgba(13,17,23,0.66); border-radius: 12px; padding: 12px 16px; }
.label { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #8b949e; }
.sep { border-top: 1px solid #30363d; }

#app { height: 100%; padding: 12px; position: relative; z-index: 1; }
#skyBg { position: fixed; left: 0; top: 0; z-index: 0; }
#simLabel { position: fixed; left: 50%; bottom: 14px; width: 260px; margin-left: -130px; z-index: 30; display: none;
  background: rgba(0,0,0,0.75); color: #fff; border-radius: 16px; padding: 6px 0; text-align: center; font-size: 15px; }
#left { width: 340px; margin-right: 12px; }
#left > .card { margin-bottom: 12px; }
#left > .card:last-child { margin-bottom: 0; }

/* Relógio */
#clock { padding-top: 8px; padding-bottom: 10px; }
/* line-height < 1: os números ocupam ~70% da altura da fonte; tira o vazio acima e abaixo. */
#timeRow { line-height: 0.82; margin-top: 4px; }
#time { font-size: 90px; font-weight: 200; letter-spacing: -2px; }
#secs { font-size: 28px; color: #8b949e; font-weight: 300; margin-left: 4px; }
#date { font-size: 21px; color: #c9d1d9; margin-top: 6px; font-weight: 300; }
#status { font-size: 12px; color: #484f58; margin-top: 4px; }

/* Sol e lua */
#sky { padding-top: 10px; padding-bottom: 10px; }
.sunRow { margin: 6px 0 3px; font-size: 20px; }
.sunItem .muted { font-size: 14px; display: block; margin-bottom: 1px; }
.moonRow { margin-bottom: 0; padding-top: 4px; }
#moonCanvas { width: 20px; height: 20px; vertical-align: -2px; margin-right: 4px; }

/* Avisos */
.alert { margin-top: 7px; padding-left: 10px; border-left: 3px solid #3fb950; }
/* Sem espaço para todos os avisos (ver fitAlerts), em etapas: 1) some o detalhe dos
   avisos verdes; 2) some o detalhe de todos; 3) somem os avisos verdes. */
#alerts.fit1 .alert.ok .a2, #alerts.fit2 .alert .a2 { display: none; }
#alerts.fit3 .alert.ok { display: none; }
#alerts { padding-top: 10px; padding-bottom: 8px; }
.alert .a1 { font-size: 18px; }
.alert .a2 { font-size: 14px; color: #8b949e; margin-top: 1px; }
.alert.ok .a1 { color: #c9d1d9; }
.alert.rain { border-color: #58a6ff; }
.alert.wind { border-color: #d29922; }
.alert.wind .a1 { color: #e3b341; }
.alert.windStrong { border-color: #f85149; }
.alert.windStrong .a1 { color: #ff7b72; }
.alert.reminder { border-color: #bc8cff; }


/* Osório (detalhado) */
#main { margin-bottom: 12px; }
.nowBlock { width: 230px; }
.cityName { font-size: 25px; font-weight: 500; }
.cityName span { font-weight: 300; color: #8b949e; font-size: 18px; }
.nowMain { margin: 4px 0 2px; }
.wi { width: 1em; height: 1em; display: inline-block; vertical-align: middle; }
.nowIcon { font-size: 80px; line-height: 1; margin-right: 10px; }
.nowIcon .wi { display: block; }
.nowTemp { font-size: 70px; font-weight: 200; line-height: 1; }
.nowDesc { font-size: 18px; margin-bottom: 2px; }
.nowRange { font-size: 17px; }
.details { -webkit-flex-wrap: wrap; flex-wrap: wrap; -webkit-align-content: space-between; align-content: space-between; }
.detail { width: 33.33%; padding: 3px 0 3px 12px; border-left: 1px solid #30363d; margin-bottom: 6px; }
.detail .muted { font-size: 14px; }
.detail .v { font-size: 21px; margin-top: 1px; white-space: nowrap; }
.section { margin-top: 8px; padding-top: 6px; }
.hours { margin-top: 6px; }
.hour { -webkit-flex: 1; flex: 1; text-align: center; }
.hour .t { font-size: 15px; color: #8b949e; }
.hour .i { font-size: 26px; line-height: 1.05; margin-top: 2px; }
.chart { display: block; }
.days { margin-top: 6px; }
.day { -webkit-flex: 1; flex: 1; text-align: center; border-radius: 10px; padding: 6px 2px; }
.day.today { background: rgba(255,255,255,0.07); }
.dayName { font-size: 18px; font-weight: 500; }
.dayDate { font-size: 14px; }
.dayIcon { font-size: 32px; line-height: 1.25; }
.dayMax { font-size: 25px; }
.dayMin { font-size: 19px; color: #8b949e; }
.dayExtra { font-size: 14px; color: #8b949e; margin-top: 3px; line-height: 1.4; }
.dayExtra .rain { color: #58a6ff; }

.chartArea { position: relative; margin-top: 4px; }
.chartArea .chart { position: absolute; left: 0; top: 0; }

/* 7 dias (alterna entre as cidades) */
#bottom { height: 222px; }
#week { padding: 10px 10px; }
.weekHead { margin: 0 6px 4px; }
.weekHead .cityName { font-size: 20px; }
.dots span { display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: #30363d; margin-left: 6px; }
.dots span.on { background: #8b949e; }
#week .day { padding: 4px 0; }
#week .dayIcon { font-size: 30px; }

/* Câmera */
#cam { height: 191px; padding: 0; overflow: hidden; position: relative; display: none; background: #000; }
#cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
#cam .camLabel { position: absolute; left: 8px; bottom: 6px; font-size: 12px; color: #fff; text-shadow: 0 1px 2px #000; }
#camOff { display: none; height: 100%; padding-top: 80px; text-align: center; font-size: 16px; color: #8b949e; }
#cam.full { position: fixed; left: 0; top: 0; right: 0; bottom: 0; width: auto; height: auto;
  margin: 0; z-index: 10; border-radius: 0; }
#cam.full img { object-fit: contain; }

#fsTip { position: fixed; left: 50%; top: 12px; width: 560px; margin-left: -280px; z-index: 20;
  background: #1f6feb; color: #fff; border-radius: 12px; padding: 12px 44px 12px 16px;
  font-size: 15px; line-height: 1.4; display: none; }
#fsTip b { font-weight: 600; }
#fsClose { position: absolute; right: 0; top: 0; width: 44px; height: 100%; text-align: center;
  font-size: 22px; line-height: 44px; }

.uv0 { color: #3fb950; } .uv1 { color: #d29922; } .uv2 { color: #f0883e; }
.uv3 { color: #f85149; } .uv4 { color: #bc8cff; }
</style>
</head>
<body>
<canvas id="skyBg"></canvas>
<div id="simLabel"></div>
<div id="app" class="row">
  <div id="left" class="col">
    <div id="clock" class="card col">
      <div id="timeRow"><span id="time">--:--</span><span id="secs">--</span></div>
      <div id="date"></div>
      <div id="status"></div>
    </div>
    <div id="sky" class="card col">
      <div class="label">Sol e Lua</div>
      <div class="sunRow row between">
        <div class="sunItem"><span class="muted">Nascer</span>🌅 <span id="sunrise">--:--</span></div>
        <div class="sunItem"><span class="muted">Pôr</span>🌇 <span id="sunset">--:--</span></div>
        <div class="sunItem"><span class="muted">Duração</span><span id="daylen">--</span></div>
      </div>
      <div class="sunRow moonRow row between sep">
        <div class="sunItem"><span id="moonName" class="muted"></span><canvas id="moonCanvas" width="40" height="40"></canvas><span id="moonIllum"></span></div>
        <div class="sunItem"><span id="moonRiseLabel" class="muted">Nasce</span><span id="moonRise">--:--</span></div>
        <div class="sunItem"><span id="moonSetLabel" class="muted">Põe</span><span id="moonSet">--:--</span></div>
      </div>
    </div>
    <div id="alerts" class="card col grow">
      <div class="label">Avisos</div>
      <div id="alertList"></div>
    </div>
    <div id="cam" class="card">
      <img id="camImg" alt="">
      <div id="camOff"></div>
      <div class="camLabel">Câmera</div>
    </div>
  </div>

  <div id="right" class="col grow">
    <div id="main" class="card col grow"></div>
    <div id="bottom" class="row">
      <div id="week" class="card col grow"></div>
    </div>
  </div>
</div>

<div id="fsTip">
  <b>Tela cheia:</b> toque em Compartilhar (□↑) na barra do Safari → <b>Adicionar à Tela de Início</b>,
  e abra o painel pelo ícone criado.
  <div id="fsClose">×</div>
</div>

<script>
// ES5 puro: o Safari do iOS 9 não tem fetch, arrow functions, template strings confiáveis etc.
(function () {
  'use strict';

  var DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  var DIAS_LONGOS = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira',
    'Quinta-feira', 'Sexta-feira', 'Sábado'];
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho',
    'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var PONTOS = ['N', 'NE', 'L', 'SE', 'S', 'SO', 'O', 'NO'];

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function add(parent, child) { parent.appendChild(child); return child; }

  function getJSON(url, ok, fail) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url + (url.indexOf('?') < 0 ? '?' : '&') + '_=' + Date.now(), true);
    xhr.timeout = 30000;
    xhr.onreadystatechange = function () {
      if (xhr.readyState !== 4) return;
      if (xhr.status === 200) {
        var data;
        try { data = JSON.parse(xhr.responseText); } catch (e) { return fail(e); }
        ok(data);
      } else {
        fail(new Error('HTTP ' + xhr.status));
      }
    };
    xhr.send();
  }

  // Não usar new Date("2026-10-29T06:12"): o Safari 9 interpreta como UTC.
  function hhmm(iso) { return iso.substr(11, 5); }
  function ymd(iso) {
    var p = iso.substr(0, 10).split('-');
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  // Hora do painel = hora do servidor no fuso do config.json. O fuso do iOS 9 ainda tem
  // horário de verão no Brasil (abolido em 2019) e o relógio do iPad pode estar atrasado.
  // now() devolve um Date cujos campos UTC são a hora local do painel: ler com getUTC*.
  var clockShift = -new Date().getTimezoneOffset() * 60000; // até o servidor responder
  function now() { return new Date(Date.now() + clockShift); }
  function syncClock() {
    var sent = Date.now();
    getJSON('/api/time', function (t) {
      clockShift = t.now + (Date.now() - sent) / 2 - Date.now() + t.offset * 60000;
      tickClock();
    }, function () {});
  }

  function todayISO() {
    var d = now();
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  function ddmm(d) { return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); }

  // ---------- Relógio ----------
  function tickClock() {
    var d = now();
    $('time').textContent = pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
    $('secs').textContent = pad(d.getUTCSeconds());
    $('date').textContent = DIAS_LONGOS[d.getUTCDay()] + ', ' + d.getUTCDate() + ' de ' + MESES[d.getUTCMonth()];
  }

  // ---------- Lua (fase) ----------
  var SYNODIC = 29.530588853;
  var NEW_MOON_REF = Date.UTC(2000, 0, 6, 18, 14); // lua nova conhecida

  function moonAge(date) {
    var age = ((date.getTime() - NEW_MOON_REF) / 86400000) % SYNODIC;
    return age < 0 ? age + SYNODIC : age;
  }

  function moonPhaseName(age) {
    var f = age / SYNODIC;
    if (f < 0.0339 || f >= 0.9661) return 'Lua Nova';
    if (f < 0.2161) return 'Lua Crescente';
    if (f < 0.2839) return 'Quarto Crescente';
    if (f < 0.4661) return 'Crescente Gibosa';
    if (f < 0.5339) return 'Lua Cheia';
    if (f < 0.7161) return 'Minguante Gibosa';
    if (f < 0.7839) return 'Quarto Minguante';
    return 'Lua Minguante';
  }

  // Desenha a lua como vista do hemisfério sul (crescente iluminada à esquerda).
  function drawMoon(age) {
    var canvas = $('moonCanvas'), ctx = canvas.getContext('2d');
    var size = canvas.width, r = size / 2 - 1, cx = size / 2, cy = size / 2;
    var k = Math.cos(2 * Math.PI * age / SYNODIC);
    var litLeft = age < SYNODIC / 2;
    var LIT = '#f2e9c9', DARK = '#2a2f37';

    ctx.clearRect(0, 0, size, size);
    ctx.fillStyle = DARK;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.fill();
    ctx.fillStyle = LIT;
    ctx.beginPath();
    if (litLeft) ctx.arc(cx, cy, r, Math.PI / 2, 3 * Math.PI / 2);
    else ctx.arc(cx, cy, r, -Math.PI / 2, Math.PI / 2);
    ctx.closePath(); ctx.fill();
    // Terminador: elipse escura (crescente) ou clara (gibosa).
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(Math.max(Math.abs(k), 0.001), 1);
    ctx.fillStyle = k > 0 ? DARK : LIT;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 2 * Math.PI); ctx.fill();
    ctx.restore();
  }

  function updateMoon() {
    var now = new Date();
    var age = moonAge(now);
    drawMoon(age);
    $('moonName').textContent = moonPhaseName(age);
    $('moonIllum').textContent = Math.round((1 - Math.cos(2 * Math.PI * age / SYNODIC)) / 2 * 100) + '%';
  }

  function moonTime(id, label, iso) {
    $(id + 'Label').textContent = label + (iso && iso.substr(0, 10) !== todayISO() ? ' amanhã' : '');
    $(id).textContent = iso ? hhmm(iso) : '--:--';
  }

  function renderSky(sun, moon) {
    $('sunrise').textContent = hhmm(sun.sunrise);
    $('sunset').textContent = hhmm(sun.sunset);
    var mins = Math.round(sun.daylight_duration / 60);
    $('daylen').textContent = Math.floor(mins / 60) + 'h' + pad(mins % 60);
    moonTime('moonRise', 'Nasce', moon.rise);
    moonTime('moonSet', 'Põe', moon.set);
  }

  // ---------- Tempo ----------
  function weatherInfo(code, isDay) {
    if (code === 0) return [isDay === 0 ? 'moon' : 'sun', 'Céu limpo'];
    if (code === 1) return [isDay === 0 ? 'moon' : 'partly', 'Poucas nuvens'];
    if (code === 2) return [isDay === 0 ? 'partlyNight' : 'partly', 'Parcialmente nublado'];
    if (code === 3) return ['cloud', 'Nublado'];
    if (code === 45 || code === 48) return ['fog', 'Nevoeiro'];
    if (code >= 51 && code <= 57) return ['drizzle', 'Garoa'];
    if (code >= 61 && code <= 67) return ['rain', code >= 65 ? 'Chuva forte' : 'Chuva'];
    if (code >= 71 && code <= 77) return ['snow', 'Neve'];
    if (code >= 80 && code <= 82) return ['rain', 'Pancadas de chuva'];
    if (code >= 85 && code <= 86) return ['snow', 'Neve'];
    if (code >= 95) return ['storm', 'Trovoada'];
    return ['cloud', ''];
  }

  // Ícones em SVG: no iOS 9 os emojis ficam presos em ~21px, qualquer que seja o font-size.
  // O tamanho vem do font-size da classe (1em).
  function sunSvg(cx, cy, r) {
    var s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#fdb813"/>';
    for (var a = 0; a < 8; a++) {
      var c = Math.cos(a * Math.PI / 4), n = Math.sin(a * Math.PI / 4);
      s += '<line x1="' + (cx + c * (r + 5)) + '" y1="' + (cy + n * (r + 5)) + '" x2="' + (cx + c * (r + 11)) +
        '" y2="' + (cy + n * (r + 11)) + '" stroke="#fdb813" stroke-width="4" stroke-linecap="round"/>';
    }
    return s;
  }
  var MOON_SVG = '<path d="M29.84 12.12A20 20 0 1 0 50.93 38.47A17 17 0 0 1 29.84 12.12Z" fill="#f5d76e"/>';
  function cloudSvg(transform, color) {
    return '<path transform="' + transform + '" fill="' + color + '" d="M18 48h30a10 10 0 0 0 0-20a14 14 0 0 0-26-4a10 10 0 0 0-4 24z"/>';
  }
  function linesSvg(color, coords) {
    var s = '';
    for (var i = 0; i < coords.length; i++) {
      var c = coords[i];
      s += '<line x1="' + c[0] + '" y1="' + c[1] + '" x2="' + c[2] + '" y2="' + c[3] +
        '" stroke="' + color + '" stroke-width="4" stroke-linecap="round"/>';
    }
    return s;
  }
  var CLOUD_UP = 'translate(0,-6)';
  var ICONS = {
    sun: sunSvg(32, 32, 13),
    moon: MOON_SVG,
    partly: sunSvg(24, 24, 9) + cloudSvg('translate(14,12) scale(0.8)', '#d0d7de'),
    partlyNight: '<g transform="translate(0,-1) scale(0.75)">' + MOON_SVG + '</g>' +
      cloudSvg('translate(14,12) scale(0.8)', '#d0d7de'),
    cloud: cloudSvg('translate(0,4)', '#d0d7de'),
    fog: cloudSvg(CLOUD_UP, '#aeb7c2') + linesSvg('#8b949e', [[12, 50, 52, 50], [16, 58, 48, 58]]),
    drizzle: cloudSvg(CLOUD_UP, '#aeb7c2') + linesSvg('#58a6ff', [[22, 49, 20, 54], [34, 49, 32, 54], [46, 49, 44, 54]]),
    rain: cloudSvg(CLOUD_UP, '#aeb7c2') + linesSvg('#58a6ff', [[22, 48, 17, 60], [34, 48, 29, 60], [46, 48, 41, 60]]),
    snow: cloudSvg(CLOUD_UP, '#d0d7de') + '<g fill="#e6edf3"><circle cx="20" cy="51" r="3.5"/>' +
      '<circle cx="32" cy="58" r="3.5"/><circle cx="44" cy="51" r="3.5"/></g>',
    storm: cloudSvg(CLOUD_UP, '#aeb7c2') + '<polygon points="34,38 23,54 31,54 27,63 41,46 33,46 38,38" fill="#fdb813"/>'
  };
  function weatherIcon(cls, name) {
    var e = el('div', cls);
    e.innerHTML = '<svg class="wi" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' + ICONS[name] + '</svg>';
    return e;
  }

  function windDir(deg) { return PONTOS[Math.round(deg / 45) % 8]; }

  function uvLevel(uv) {
    if (uv < 3) return [0, 'baixo'];
    if (uv < 6) return [1, 'moderado'];
    if (uv < 8) return [2, 'alto'];
    if (uv < 11) return [3, 'muito alto'];
    return [4, 'extremo'];
  }

  function detail(parent, label, value, cls) {
    var d = add(parent, el('div', 'detail'));
    add(d, el('div', 'muted', label));
    add(d, el('div', 'v' + (cls ? ' ' + cls : ''), value));
  }

  function renderDays(parent, daily, extended) {
    var row = add(parent, el('div', 'days row grow'));
    for (var i = 0; i < daily.time.length; i++) {
      var d = ymd(daily.time[i]);
      var day = add(row, el('div', 'day col between' + (i === 0 ? ' today' : '')));
      var head = add(day, el('div'));
      add(head, el('div', 'dayName', i === 0 ? 'Hoje' : DIAS[d.getDay()]));
      if (extended) add(head, el('div', 'dayDate muted', ddmm(d)));
      add(day, weatherIcon('dayIcon', weatherInfo(daily.weather_code[i], 1)[0]));
      var temps = add(day, el('div'));
      add(temps, el('div', 'dayMax', Math.round(daily.temperature_2m_max[i]) + '°'));
      add(temps, el('div', 'dayMin', Math.round(daily.temperature_2m_min[i]) + '°'));
      var extra = add(day, el('div', 'dayExtra'));
      var rain = daily.precipitation_probability_max[i];
      var rainTxt = rain == null ? '' : rain + '%';
      if (extended && daily.precipitation_sum[i] >= 0.5) rainTxt += ' ' + Math.round(daily.precipitation_sum[i]) + 'mm';
      add(extra, el('div', 'rain', rainTxt));
    }
  }

  function renderDetailed(box, city) {
    var cur = city.current, daily = city.daily, hourly = city.hourly;
    box.innerHTML = '';
    var w = weatherInfo(cur.weather_code, cur.is_day);

    var top = add(box, el('div', 'row'));
    var nowB = add(top, el('div', 'nowBlock col'));
    add(nowB, el('div', 'cityName', city.name));
    var main = add(nowB, el('div', 'nowMain row center'));
    add(main, weatherIcon('nowIcon', w[0]));
    add(main, el('div', 'nowTemp', Math.round(cur.temperature_2m) + '°'));
    add(nowB, el('div', 'nowDesc', w[1]));
    add(nowB, el('div', 'nowRange muted', 'Máx ' + Math.round(daily.temperature_2m_max[0]) +
      '°  ·  Mín ' + Math.round(daily.temperature_2m_min[0]) + '°'));

    var det = add(top, el('div', 'details row grow'));
    var uv = uvLevel(cur.uv_index);
    detail(det, 'Sensação', Math.round(cur.apparent_temperature) + '°');
    detail(det, 'Umidade', cur.relative_humidity_2m + '%');
    detail(det, 'Ponto de orvalho', Math.round(cur.dew_point_2m) + '°');
    detail(det, 'Vento', Math.round(cur.wind_speed_10m) + ' km/h ' + windDir(cur.wind_direction_10m));
    detail(det, 'Rajadas', Math.round(cur.wind_gusts_10m) + ' km/h');
    detail(det, 'Pressão', Math.round(cur.pressure_msl) + ' hPa');
    detail(det, 'Índice UV', Math.round(cur.uv_index) + ' ' + uv[1], 'uv' + uv[0]);
    detail(det, 'Nuvens', cur.cloud_cover + '%');
    detail(det, 'Visibilidade', (cur.visibility >= 10000 ? '10+' : (cur.visibility / 1000).toFixed(1)) + ' km');

    var hs = add(box, el('div', 'section sep col grow'));
    add(hs, el('div', 'label', 'Próximas ' + hourly.time.length + ' horas'));
    var hours = add(hs, el('div', 'hours row'));
    for (var i = 0; i < hourly.time.length; i++) {
      var h = add(hours, el('div', 'hour'));
      add(h, el('div', 't', hourly.time[i].substr(11, 2) + 'h'));
      add(h, weatherIcon('i', weatherInfo(hourly.weather_code[i], hourly.is_day[i])[0]));
    }
    // O gráfico ocupa a altura que sobrar no card (medida depois do layout).
    var area = add(hs, el('div', 'chartArea grow'));
    var chart = add(area, el('canvas', 'chart'));
    redrawChart = function () {
      drawHourChart(chart, area.offsetWidth, Math.max(area.offsetHeight, 80),
        hourly.temperature_2m, hourly.precipitation_probability);
    };
    setTimeout(redrawChart, 0);
  }

  var redrawChart = null;
  window.addEventListener('resize', function () { if (redrawChart) redrawChart(); fitAlerts(); });

  // Linha da temperatura com o valor em cada hora; barras azuis = chance de chuva (% na base).
  function drawHourChart(canvas, width, height, temps, probs) {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = width * dpr; canvas.height = height * dpr;
    canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
    var ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    var n = temps.length, col = width / n;
    var min = Math.min.apply(null, temps), max = Math.max.apply(null, temps);
    var base = height - 17; // faixa de baixo: % de chuva
    var span = Math.max(max - min, 4), top = 24, bottom = base - 6;
    function x(i) { return col * i + col / 2; }
    function y(t) { return bottom - (t - min) / span * (bottom - top); }

    ctx.fillStyle = 'rgba(88,166,255,0.22)';
    for (var i = 0; i < n; i++) {
      var bh = (probs[i] || 0) / 100 * (base - top);
      ctx.fillRect(x(i) - col * 0.3, base - bh, col * 0.6, bh);
    }
    ctx.fillStyle = '#58a6ff'; ctx.font = '14px "Helvetica Neue", Helvetica, Arial, sans-serif';
    ctx.textAlign = 'center';
    for (i = 0; i < n; i++) if (probs[i] >= 10) ctx.fillText(probs[i] + '%', x(i), height - 2);
    ctx.strokeStyle = '#f0b72f'; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (i = 0; i < n; i++) i ? ctx.lineTo(x(i), y(temps[i])) : ctx.moveTo(x(i), y(temps[i]));
    ctx.stroke();
    ctx.fillStyle = '#f0b72f';
    for (i = 0; i < n; i++) { ctx.beginPath(); ctx.arc(x(i), y(temps[i]), 3, 0, 2 * Math.PI); ctx.fill(); }
    ctx.fillStyle = '#e6edf3'; ctx.font = '19px "Helvetica Neue", Helvetica, Arial, sans-serif';
    ctx.textAlign = 'center';
    for (i = 0; i < n; i++) ctx.fillText(Math.round(temps[i]) + '°', x(i), y(temps[i]) - 8);
  }

  // ---------- Avisos ----------
  var GUST_WARN = 50, GUST_STRONG = 70; // km/h
  var RAIN_MM = 0.1, RAIN_PROB = 50;

  // "2026-10-30T15:45" (hora local do painel) em ms, no mesmo referencial de now().
  function localTime(iso) {
    return Date.UTC(+iso.substr(0, 4), +iso.substr(5, 2) - 1, +iso.substr(8, 2),
      +iso.substr(11, 2), +iso.substr(14, 2));
  }
  function inMinutes(mins) {
    mins = Math.max(5, Math.round(mins / 5) * 5);
    return mins < 60 ? mins + ' min' : Math.floor(mins / 60) + 'h' + (mins % 60 ? pad(mins % 60) : '');
  }

  // Minutos até o primeiro bloco de 15 min (ainda não passado) em que cond(chuva em mm) é verdadeira.
  function firstSlot(m15, cond) {
    if (!m15) return null;
    var nowMs = now().getTime();
    for (var i = 0; i < m15.time.length; i++) {
      var t = localTime(m15.time[i]);
      if (t + 15 * 60000 <= nowMs) continue;
      if (cond(m15.precipitation[i] || 0)) return Math.max(0, (t - nowMs) / 60000);
    }
    return null;
  }

  function rainAlert(city) {
    var cur = city.current, h = city.hourly, m15 = city.minutely_15;
    if (cur.precipitation >= RAIN_MM) {
      var stop = firstSlot(m15, function (mm) { return mm < RAIN_MM; });
      return ['rain', 'Chovendo agora', stop !== null ? 'Deve parar em ~' + inMinutes(stop)
        : 'Deve continuar nas próximas 2 horas'];
    }
    var start = firstSlot(m15, function (mm) { return mm >= RAIN_MM; });
    if (start !== null) {
      return ['rain', start < 10 ? 'Chuva começando' : 'Chuva em ~' + inMinutes(start),
        'Pela previsão de 15 em 15 min'];
    }
    for (var i = 0; i < h.time.length; i++) {
      if (h.precipitation_probability[i] >= RAIN_PROB && h.precipitation[i] >= RAIN_MM) {
        return ['rain', 'Chuva provável às ' + h.time[i].substr(11, 2) + 'h',
          h.precipitation_probability[i] + '% de chance'];
      }
    }
    return ['ok', 'Sem chuva prevista', 'Nas próximas ' + h.time.length + ' horas'];
  }

  function windAlert(city) {
    var cur = city.current, h = city.hourly;
    var level = function (g) { return g >= GUST_STRONG ? 'windStrong' : 'wind'; };
    if (cur.wind_gusts_10m >= GUST_WARN) {
      return [level(cur.wind_gusts_10m), 'Rajadas fortes agora',
        Math.round(cur.wind_gusts_10m) + ' km/h ' + windDir(cur.wind_direction_10m)];
    }
    var max = 0, at = 0;
    for (var i = 0; i < h.time.length; i++) {
      if (h.wind_gusts_10m[i] > max) { max = h.wind_gusts_10m[i]; at = i; }
    }
    if (max >= GUST_WARN) {
      return [level(max), 'Rajadas de até ' + Math.round(max) + ' km/h',
        'Por volta das ' + h.time[at].substr(11, 2) + 'h, vindo de ' + windDir(h.wind_direction_10m[at])];
    }
    return ['ok', 'Sem rajadas fortes', 'Máxima de ' + Math.round(max) + ' km/h nas próximas ' + h.time.length + ' h'];
  }

  // Lembretes fixos do config.json: {"days": ["seg", "qua", "sex"], "text": "...", "detail": "..."}.
  var DIAS_CFG = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sab'];
  var reminders = [], alertCity = null;

  function todayReminders() {
    var today = DIAS_CFG[now().getUTCDay()], out = [];
    for (var i = 0; i < reminders.length; i++) {
      var r = reminders[i], days = r.days || [];
      for (var j = 0; j < days.length; j++) {
        if (days[j].toLowerCase().replace('á', 'a').substr(0, 3) === today) {
          out.push(['reminder', r.text, r.detail || 'Hoje']);
          break;
        }
      }
    }
    return out;
  }

  function renderAlerts(city) {
    alertCity = city;
    var list = $('alertList');
    list.innerHTML = '';
    var items = todayReminders().concat([rainAlert(city), windAlert(city)]);
    for (var i = 0; i < items.length; i++) {
      var a = add(list, el('div', 'alert ' + items[i][0]));
      add(a, el('div', 'a1', items[i][1]));
      add(a, el('div', 'a2', items[i][2]));
    }
    fitAlerts();
  }

  function fitAlerts() {
    var box = $('alerts'), base = box.className.replace(/ fit\d/g, '');
    box.className = base;
    for (var step = 1; step <= 3 && box.scrollHeight > box.clientHeight + 1; step++) {
      box.className = base + ' fit' + step + (step === 3 ? ' fit2' : '');
    }
  }


  // 7 dias: alterna entre as cidades a cada WEEK_ROTATE segundos.
  var WEEK_ROTATE = 10;
  var weekCities = [], weekIndex = 0;

  function renderWeek() {
    var box = $('week'), city = weekCities[weekIndex];
    if (!city) return;
    box.innerHTML = '';
    var head = add(box, el('div', 'weekHead row between center'));
    var name = add(head, el('div', 'cityName', city.name));
    add(name, el('span', '', '  ·  próximos 7 dias'));
    var dots = add(head, el('div', 'dots'));
    for (var i = 0; i < weekCities.length; i++) add(dots, el('span', i === weekIndex ? 'on' : ''));
    renderDays(box, city.daily, true);
  }

  setInterval(function () {
    if (weekCities.length < 2) return;
    weekIndex = (weekIndex + 1) % weekCities.length;
    renderWeek();
  }, WEEK_ROTATE * 1000);

  function updateWeather() {
    getJSON('/api/weather', function (data) {
      try {
        for (var i = 0; i < data.cities.length; i++) {
          var c = data.cities[i];
          if (c.detailed) { renderDetailed($('main'), c); renderAlerts(c); }
        }
        weekCities = data.cities;
        weekIndex = weekIndex % weekCities.length;
        renderWeek();
        renderSky(data.sun, data.moon);
        updateSkyBg(data);
      } catch (e) {
        // Ex.: servidor antigo ainda rodando com formato de dados diferente.
        $('status').textContent = 'Erro ao montar o tempo: ' + e.message + ' (reinicie o server.py)';
        setTimeout(updateWeather, 60 * 1000);
        return;
      }
      var d = now();
      $('status').textContent = 'Atualizado às ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
      setTimeout(updateWeather, 10 * 60 * 1000);
    }, function (err) {
      $('status').textContent = 'Erro ao buscar o tempo (' + err.message + ')';
      setTimeout(updateWeather, 60 * 1000);
    });
  }

  // ---------- Fundo (céu) ----------
  // Desenhado uma vez por minuto, sem animação (leve para o iPad mini 1).
  // Sol anda da direita (nascente) para a esquerda (poente); o céu clareia e escurece
  // com ele; nuvens, cinza e chuva conforme o tempo atual de Osório.
  var skyData = null;

  // Simulação (só para testar o fundo):
  //   ?demo=1                            o dia inteiro em 2 min; o tempo muda a cada volta
  //   ?hora=18:30&tempo=rain&nuvens=90   um momento fixo (tempo: sun partly cloud fog drizzle rain storm)
  var SIM = {};
  (function () {
    var q = location.search.substr(1).split('&');
    for (var i = 0; i < q.length; i++) {
      var kv = q[i].split('=');
      if (kv[0]) SIM[kv[0]] = decodeURIComponent(kv[1] || '');
    }
  })();
  var DEMO_LAP = 120 * 1000, demoStart = Date.now();
  var DEMO_WEATHER = [['sun', 0, 'Sol'], ['partly', 45, 'Algumas nuvens'], ['rain', 95, 'Chuva'],
    ['cloud', 90, 'Nublado'], ['storm', 100, 'Trovoada'], ['fog', 80, 'Nevoeiro'], ['drizzle', 85, 'Garoa']];

  function skySim() {
    var d = now(), midnight = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
    var out = { t: d.getTime(), clouds: null, kind: null, label: null };
    if (SIM.demo) {
      var elapsed = Date.now() - demoStart, w = DEMO_WEATHER[Math.floor(elapsed / DEMO_LAP) % DEMO_WEATHER.length];
      out.t = midnight + (elapsed % DEMO_LAP) / DEMO_LAP * 86400000;
      out.kind = w[0]; out.clouds = w[1]; out.label = w[2];
    } else if (SIM.hora) {
      var hm = SIM.hora.split(':');
      out.t = midnight + (+hm[0] * 60 + (+hm[1] || 0)) * 60000;
      out.label = 'tempo atual';
      for (var i = 0; i < DEMO_WEATHER.length; i++) if (DEMO_WEATHER[i][0] === SIM.tempo) out.label = DEMO_WEATHER[i][2];
    }
    if (SIM.tempo) out.kind = SIM.tempo;
    if (SIM.nuvens) out.clouds = +SIM.nuvens;
    if (out.label) {
      var st = new Date(out.t), lab = $('simLabel');
      lab.style.display = 'block';
      lab.textContent = 'Simulação  ' + pad(st.getUTCHours()) + ':' + pad(st.getUTCMinutes()) + '  ·  ' + out.label;
    }
    return out;
  }

  function mixColor(a, b, t) {
    t = Math.max(0, Math.min(1, t));
    var pa = [parseInt(a.substr(1, 2), 16), parseInt(a.substr(3, 2), 16), parseInt(a.substr(5, 2), 16)];
    var pb = [parseInt(b.substr(1, 2), 16), parseInt(b.substr(3, 2), 16), parseInt(b.substr(5, 2), 16)];
    var out = '#';
    for (var i = 0; i < 3; i++) {
      var v = Math.round(pa[i] + (pb[i] - pa[i]) * t);
      out += (v < 16 ? '0' : '') + v.toString(16);
    }
    return out;
  }

  // Números pseudo-aleatórios fixos: estrelas e nuvens não pulam a cada redesenho.
  function seeded(seed) {
    return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  }

  function updateSkyBg(data) {
    var city = null;
    for (var i = 0; i < data.cities.length; i++) if (data.cities[i].detailed) city = data.cities[i];
    if (!city) return;
    skyData = { sunrise: data.sun.sunrise, sunset: data.sun.sunset,
      clouds: city.current.cloud_cover, kind: weatherInfo(city.current.weather_code, 1)[0] };
    drawSkyBg();
  }

  function drawSkyBg() {
    var canvas = $('skyBg'), W = window.innerWidth, H = window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    if (canvas.width !== W * dpr || canvas.height !== H * dpr) {
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    }
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!skyData) { ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, W, H); return; }

    var sim = skySim(), t = sim.t, rise = localTime(skyData.sunrise), set = localTime(skyData.sunset);
    var p = (t - rise) / (set - rise);                  // 0 = nascer, 1 = pôr
    var alt = p > 0 && p < 1 ? Math.sin(Math.PI * p) : 0;
    var TWI = 45 * 60000;                              // crepúsculo: 45 min
    var dist = p < 0 ? rise - t : p > 1 ? t - set : 0;
    // luz: 0 = noite, 0.3 = nascer/pôr, 1 = dia pleno
    var light = dist ? 0.3 * Math.max(0, 1 - dist / TWI) : 0.3 + 0.7 * Math.min(1, alt * 2.5);

    var c = (sim.clouds !== null ? sim.clouds : skyData.clouds || 0) / 100, kind = sim.kind || skyData.kind;
    var wet = kind === 'rain' || kind === 'drizzle' || kind === 'storm';
    var gray = Math.min(0.95, c * 0.7 + (wet ? 0.3 : 0) + (kind === 'fog' ? 0.4 : 0));

    var top = light < 0.3 ? mixColor('#070b14', '#1d2a4a', light / 0.3) : mixColor('#1d2a4a', '#2f6fb5', (light - 0.3) / 0.7);
    var bottom = light < 0.3 ? mixColor('#121a2b', '#d9774a', light / 0.3) : mixColor('#d9774a', '#8fc3ec', (light - 0.3) / 0.7);
    var grayTop = mixColor('#0e1116', kind === 'storm' ? '#4a525c' : '#6f7882', light);
    var grayBottom = mixColor('#1a1e24', kind === 'storm' ? '#5d656e' : '#a3abb4', light);
    top = mixColor(top, grayTop, gray); bottom = mixColor(bottom, grayBottom, gray);

    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, top); g.addColorStop(1, bottom);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    var rnd, i2;
    // Estrelas: só à noite e com céu aberto.
    var starAlpha = (1 - light / 0.3) * (1 - c);
    if (light < 0.3 && starAlpha > 0.05) {
      rnd = seeded(7);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.8 * starAlpha).toFixed(2) + ')';
      for (i2 = 0; i2 < 90; i2++) ctx.fillRect(rnd() * W, rnd() * H * 0.8, rnd() < 0.2 ? 2 : 1, rnd() < 0.2 ? 2 : 1);
    }

    // Sol: direita = nascente, esquerda = poente.
    if (p > -0.03 && p < 1.03) {
      var horizon = H * 0.96, sx = W * (1 - Math.max(0, Math.min(1, p))), sy = horizon - alt * (horizon - 90);
      var sunVis = 1 - c * 0.85 - (wet ? 0.1 : 0);
      if (sunVis > 0.05) {
        var sunColor = mixColor('#ff9a4d', '#fff4c2', alt * 2);
        var glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, 160);
        glow.addColorStop(0, 'rgba(255,230,160,' + (0.55 * sunVis).toFixed(2) + ')');
        glow.addColorStop(1, 'rgba(255,230,160,0)');
        ctx.fillStyle = glow; ctx.fillRect(sx - 160, sy - 160, 320, 320);
        ctx.globalAlpha = sunVis;
        ctx.fillStyle = sunColor;
        ctx.beginPath(); ctx.arc(sx, sy, 30, 0, 2 * Math.PI); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // Nuvens: quantidade pela cobertura; andam devagar (um pouco a cada minuto).
    var n = Math.round(c * 12);
    if (n) {
      rnd = seeded(42);
      var drift = (t / 60000) * 1.5;
      var cloudRGB = light > 0.3 ? (wet ? '150,158,168' : '235,240,245') : '70,78,90';
      for (i2 = 0; i2 < n; i2++) {
        var cx = ((rnd() * (W + 300) + drift * (0.5 + rnd())) % (W + 300)) - 150;
        var cy = 40 + rnd() * H * 0.75, s = 50 + rnd() * 70;
        ctx.fillStyle = 'rgba(' + cloudRGB + ',' + (0.35 + 0.35 * c).toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(cx, cy, s * 0.55, 0, 2 * Math.PI);
        ctx.arc(cx + s * 0.55, cy + s * 0.1, s * 0.45, 0, 2 * Math.PI);
        ctx.arc(cx - s * 0.55, cy + s * 0.15, s * 0.4, 0, 2 * Math.PI);
        ctx.arc(cx + s * 0.1, cy - s * 0.3, s * 0.45, 0, 2 * Math.PI);
        ctx.fill();
      }
    }

    // Chuva: riscos inclinados, parados (sem animação).
    if (wet) {
      rnd = seeded(99);
      var drops = kind === 'drizzle' ? 90 : 200, len = kind === 'drizzle' ? 8 : 16;
      ctx.strokeStyle = 'rgba(190,210,235,' + (kind === 'drizzle' ? 0.25 : 0.35) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (i2 = 0; i2 < drops; i2++) {
        var rx = rnd() * W, ry = rnd() * H;
        ctx.moveTo(rx, ry); ctx.lineTo(rx - len * 0.3, ry + len);
      }
      ctx.stroke();
    }
  }

  drawSkyBg();
  setInterval(drawSkyBg, SIM.demo ? 250 : 60 * 1000);
  window.addEventListener('resize', drawSkyBg);

  // ---------- Câmera ----------
  // hours = "07:30-18:00" (camera.active_hours); fora dele a página não pede imagens.
  function cameraActive(hours) {
    if (!hours) return true;
    var p = hours.split('-'), d = now(), m = d.getUTCHours() * 60 + d.getUTCMinutes();
    var mins = function (s) { var hm = s.split(':'); return +hm[0] * 60 + +hm[1]; };
    var start = mins(p[0]), end = mins(p[1]);
    return start <= end ? m >= start && m < end : m >= start || m < end;
  }

  function startCamera(refreshSeconds, hours) {
    var cam = $('cam'), img = $('camImg'), off = $('camOff');
    cam.style.display = 'block';
    function load() {
      if (!cameraActive(hours)) {
        cam.className = 'card';
        img.style.display = 'none';
        off.style.display = 'block';
        off.textContent = 'Câmera desligada até ' + hours.split('-')[0].replace(/^0/, '');
        return setTimeout(load, 60 * 1000);
      }
      off.style.display = 'none';
      img.style.display = 'block';
      img.src = '/api/camera.jpg?_=' + Date.now();
    }
    function next(delay) { setTimeout(load, delay); }
    img.onload = function () { next(refreshSeconds * 1000); };
    img.onerror = function () { next(15000); };
    cam.onclick = function () {
      cam.className = cam.className.indexOf('full') >= 0 ? 'card' : 'card full';
    };
    next(0);
  }

  // ---------- Início ----------
  tickClock();
  setInterval(tickClock, 1000);
  syncClock();
  setInterval(syncClock, 60 * 60 * 1000);
  updateMoon();
  setInterval(updateMoon, 60 * 60 * 1000);
  updateWeather();
  getJSON('/api/config', function (cfg) {
    if (cfg.camera) startCamera(cfg.camera_refresh_seconds || 5, cfg.camera_hours);
    reminders = cfg.reminders || [];
    if (alertCity) renderAlerts(alertCity);
  }, function () {});

  // O Safari do iOS 9 não tem API de tela cheia; só aberto pela Tela de Início
  // (navigator.standalone) a barra some. Mostra a dica quando aberto pelo Safari.
  var tipKey = 'fsTipHidden';
  var tipHidden = false;
  try { tipHidden = localStorage.getItem(tipKey) === '1'; } catch (e) {}
  if (navigator.standalone === false && !tipHidden) {
    $('fsTip').style.display = 'block';
    $('fsClose').onclick = function () {
      $('fsTip').style.display = 'none';
      try { localStorage.setItem(tipKey, '1'); } catch (e) {}
    };
  }

  // Recarrega a página a cada 6h para evitar acúmulo de memória no Safari antigo.
  setTimeout(function () { location.reload(); }, 6 * 60 * 60 * 1000);
})();
</script>
</body>
</html>
